<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="100%" height="100%">
  <defs>
    <!-- Gradientes de Oro / Metal -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3CE"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#E8833A"/>
      <stop offset="100%" stop-color="#9A4511"/>
    </linearGradient>

    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8833A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E8833A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shield-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#283338"/>
      <stop offset="50%" stop-color="#1B2225"/>
      <stop offset="100%" stop-color="#121618"/>
    </linearGradient>

    <!-- Fuego / Magia -->
    <linearGradient id="flame-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="85%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Hoja de espada -->
    <linearGradient id="blade-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="blade-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Luz / Curación -->
    <radialGradient id="heal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="magic-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#E8833A" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#2F6FB0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1A1F21" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip path para el contenedor principal -->
    <clipPath id="card-clip">
      <rect width="640" height="370" rx="16"/>
    </clipPath>

    <!-- Filtro sombra dramática -->
    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="flame-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Contenedor con ClipPath para que nada desborde -->
  <g clip-path="url(#card-clip)">
    <!-- Fondo principal -->
    <rect width="640" height="370" fill="#1A1F21" stroke="#2C3539" stroke-width="2"/>
    <circle cx="320" cy="115" r="160" fill="url(#magic-glow)"/>

    <!-- ==================== ESCUDO HERÁLDICO CENTRAL ==================== -->
    <g filter="url(#logo-shadow)">
      <!-- Resplandor de Curación (Luz esmeralda en el cuadrante derecho) -->
      <circle cx="370" cy="85" r="48" fill="url(#heal-glow)"/>

      <!-- Capa exterior del escudo (Borde Dorado con Bisel) -->
      <path d="M 320 22 
               C 365 22, 395 32, 400 40 
               C 402 110, 375 162, 320 196 
               C 265 162, 238 110, 240 40 
               C 245 32, 275 22, 320 22 Z" 
            fill="url(#shield-rim)" stroke="#FFE382" stroke-width="1.2"/>

      <!-- Capa interior del escudo -->
      <path d="M 320 30 
               C 360 30, 386 38, 390 46 
               C 392 106, 368 152, 320 184 
               C 272 152, 248 106, 250 46 
               C 254 38, 280 30, 320 30 Z" 
            fill="url(#shield-bg)" stroke="#161B1D" stroke-width="1.5"/>

      <!-- Líneas heráldicas divisorias sutiles -->
      <path d="M 320 30 L 320 184" stroke="#2B363A" stroke-width="1.5"/>
      <path d="M 250 85 C 280 95, 360 95, 390 85" stroke="#2B363A" stroke-width="1" fill="none"/>

      <!-- LLAMA MÁGICA / FUEGO (Habilidad: Bola de Fuego - Izquierda) -->
      <g transform="translate(262, 70) scale(0.75)" filter="url(#flame-glow)">
        <path d="M 30 55 
                 C 10 50, 0 35, 12 18 
                 C 15 25, 22 28, 22 22 
                 C 22 10, 38 0, 42 0 
                 C 42 12, 55 20, 50 35 
                 C 60 28, 62 20, 62 20 
                 C 70 32, 65 52, 48 56 
                 C 42 48, 40 38, 36 40 
                 C 32 42, 34 50, 30 55 Z" 
              fill="url(#flame-grad)"/>
      </g>

      <!-- DESTELLO DE LUZ / CURACIÓN (Habilidad: Curación - Derecha) -->
      <g transform="translate(365, 80)">
        <path d="M 0 -17 Q 0 0 17 0 Q 0 0 0 17 Q 0 0 -17 0 Q 0 0 0 -17 Z" 
              fill="#6EE7B7" filter="url(#flame-glow)"/>
        <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
        <circle cx="15" cy="-13" r="1.8" fill="#A7F3D0"/>
        <circle cx="-13" cy="15" r="1.8" fill="#A7F3D0"/>
      </g>

      <!-- ESPADA CENTRAL (Habilidad: Golpe de Espada) -->
      <g transform="translate(320, 26)">
        <!-- Hoja (Bicolor reflejo) -->
        <polygon points="0,22 -6,27 -2,126 0,136" fill="url(#blade-left)"/>
        <polygon points="0,22 6,27 2,126 0,136" fill="url(#blade-right)"/>
        <line x1="0" y1="26" x2="0" y2="124" stroke="#475569" stroke-width="0.8"/>

        <!-- Guarda / Empuñadura en Cruz -->
        <path d="M -24 23 C -20 18, -12 25, 0 24 C 12 25, 20 18, 24 23 C 26 27, 20 28, 0 27 C -20 28, -26 27, -24 23 Z" 
              fill="url(#gold-grad)" stroke="#78350F" stroke-width="0.8"/>

        <!-- Pomo / Empuñadura con tiras doradas -->
        <rect x="-3" y="10" width="6" height="13" rx="1.5" fill="#B45309" stroke="#78350F" stroke-width="0.6"/>
        <line x1="-3" y1="14" x2="3" y2="14" stroke="#FDE68A" stroke-width="0.8"/>
        <line x1="-3" y1="18" x2="3" y2="18" stroke="#FDE68A" stroke-width="0.8"/>

        <!-- Remate / Pomo joya -->
        <circle cx="0" cy="8" r="4.5" fill="url(#gold-grad)" stroke="#78350F" stroke-width="0.8"/>
        <circle cx="0" cy="8" r="2.2" fill="#3B82F6"/> <!-- Joya azul zafiro -->
      </g>

      <!-- MONOGRAMA "U" HERÁLDICA SOBRE EL PECHO DEL ESCUDO -->
      <g transform="translate(320, 160)">
        <path d="M -15 -18 L -15 -4 C -15 9, 15 9, 15 -4 L 15 -18 L 10 -18 L 10 -4 C 10 5, -10 5, -10 -4 L -10 -18 Z" 
              fill="url(#gold-grad)" stroke="#78350F" stroke-width="0.8"/>
      </g>
    </g>

    <!-- ==================== TIPOGRAFÍA Y TÍTULO ==================== -->
    <g filter="url(#logo-shadow)">
      <!-- Título Principal: UCABILIA -->
      <text x="320" y="258" 
            font-family="'Cinzel', 'Trajan Pro', 'Palatino Linotype', 'Georgia', serif" 
            font-size="44" 
            font-weight="800" 
            letter-spacing="9" 
            fill="url(#gold-grad)" 
            stroke="#78350F" 
            stroke-width="1.2"
            text-anchor="middle">UCABILIA</text>

      <!-- Línea decorativa con rombos -->
      <g transform="translate(320, 276)">
        <line x1="-190" y1="0" x2="-30" y2="0" stroke="url(#gold-line)" stroke-width="2"/>
        <polygon points="0,-5 5,0 0,5 -5,0" fill="#FBBF24"/>
        <circle cx="-14" cy="0" r="2.2" fill="#F59E0B"/>
        <circle cx="14" cy="0" r="2.2" fill="#F59E0B"/>
        <line x1="30" y1="0" x2="190" y2="0" stroke="url(#gold-line)" stroke-width="2"/>
      </g>

      <!-- Subtítulo: CATÁLOGO DE HABILIDADES -->
      <text x="320" y="304" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" 
            font-weight="700" 
            letter-spacing="4.5" 
            fill="#E2E8F0" 
            text-anchor="middle">CATÁLOGO DE HABILIDADES</text>

      <!-- Badge RPG -->
      <g transform="translate(320, 328)">
        <rect x="-95" y="-10" width="190" height="20" rx="10" fill="#242D30" stroke="#3D4B52" stroke-width="1"/>
        <text x="0" y="4.5" 
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
              font-size="9" 
              font-weight="700" 
              letter-spacing="2" 
              fill="#A2B4BC" 
              text-anchor="middle">JUEGO DE ROL POR TURNOS</text>
      </g>
    </g>
  </g>
</svg>
