<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Marcadores de flechas -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3E82C8" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#E8833A" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2E6B4F" />
    </marker>
    <marker id="implements-triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <polygon points="1,1 11,6 1,11" fill="#23292B" stroke="#6B7671" stroke-width="1.5" />
    </marker>

    <!-- Filtro sombra suave -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo Principal -->
  <rect width="920" height="520" rx="16" fill="#1E2324" stroke="#2F383B" stroke-width="1.5"/>

  <!-- Barra Superior / Encabezado -->
  <g transform="translate(40, 32)">
    <rect x="0" y="0" width="840" height="42" rx="8" fill="#252D30"/>
    <circle cx="20" cy="21" r="5" fill="#E8833A" />
    <circle cx="36" cy="21" r="5" fill="#3E82C8" />
    <circle cx="52" cy="21" r="5" fill="#2E6B4F" />
    <text x="75" y="26" font-size="15" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">UCABILIA</text>
    <text x="165" y="26" font-size="14" fill="#9FA8A3">Catálogo de Habilidades — Desacoplamiento con Patrones</text>
    
    <!-- Tags de patrones -->
    <rect x="610" y="10" width="70" height="22" rx="4" fill="#1C3854"/>
    <text x="645" y="25" font-size="11" font-weight="600" fill="#7DB8FF" text-anchor="middle">Singleton</text>
    
    <rect x="688" y="10" width="64" height="22" rx="4" fill="#3B2E1E"/>
    <text x="720" y="25" font-size="11" font-weight="600" fill="#F3A86E" text-anchor="middle">Factory</text>

    <rect x="760" y="10" width="70" height="22" rx="4" fill="#193B2D"/>
    <text x="795" y="25" font-size="11" font-weight="600" fill="#6BD6A2" text-anchor="middle">Strategy</text>
  </g>

  <!-- ==================== 1. CARD: PERSONAJE (CONTEXTO) ==================== -->
  <g transform="translate(40, 95)" filter="url(#card-shadow)">
    <rect width="250" height="270" rx="10" fill="#252D30" stroke="#3A464A" stroke-width="1.2"/>
    <!-- Cabecera Card -->
    <path d="M 0 10 Q 0 0 10 0 L 240 0 Q 250 0 250 10 L 250 44 L 0 44 Z" fill="#2B363A"/>
    <rect x="14" y="12" width="76" height="20" rx="4" fill="#1C3854"/>
    <text x="52" y="26" font-size="10.5" font-weight="700" fill="#7DB8FF" text-anchor="middle">CONTEXTO</text>
    <text x="100" y="27" font-size="16" font-weight="700" fill="#FFFFFF">Personaje</text>

    <!-- Atributos -->
    <text x="18" y="68" font-size="12.5" fill="#D6DCD8" font-family="monospace">- hp: number</text>
    <text x="18" y="88" font-size="12.5" fill="#D6DCD8" font-family="monospace">+ nombre: string</text>
    
    <line x1="14" y1="102" x2="236" y2="102" stroke="#354045" stroke-width="1"/>

    <!-- Métodos -->
    <text x="18" y="122" font-size="12" font-weight="600" fill="#E8833A" font-family="monospace">+ usarHabilidad(id, obj)</text>
    <text x="18" y="142" font-size="12" fill="#D6DCD8" font-family="monospace">+ recibirDanio(cant)</text>
    <text x="18" y="162" font-size="12" fill="#D6DCD8" font-family="monospace">+ curar(cant)</text>

    <!-- Badge Explicativo -->
    <rect x="14" y="184" width="222" height="72" rx="6" fill="#1D2325" stroke="#313D41" stroke-width="1"/>
    <circle cx="28" cy="202" r="5" fill="#E8833A"/>
    <text x="40" y="206" font-size="11.5" font-weight="600" fill="#FFFFFF">Sin switch ni if</text>
    <text x="24" y="226" font-size="10.5" fill="#9FA8A3">No implementa habilidades.</text>
    <text x="24" y="242" font-size="10.5" fill="#9FA8A3">Pide la estrategia y delega.</text>
  </g>

  <!-- ==================== 2. CARD: REGISTRO (SINGLETON + FACTORY) ==================== -->
  <g transform="translate(330, 95)" filter="url(#card-shadow)">
    <rect width="265" height="270" rx="10" fill="#252D30" stroke="#3E82C8" stroke-width="1.4"/>
    <!-- Cabecera Card -->
    <path d="M 0 10 Q 0 0 10 0 L 255 0 Q 265 0 265 10 L 265 44 L 0 44 Z" fill="#1C3042"/>
    <rect x="12" y="12" width="124" height="20" rx="4" fill="#132332"/>
    <text x="74" y="26" font-size="10" font-weight="700" fill="#7DB8FF" text-anchor="middle">SINGLETON / FACTORY</text>
    <text x="146" y="27" font-size="14.5" font-weight="700" fill="#FFFFFF">Registro</text>

    <!-- Atributos -->
    <text x="16" y="68" font-size="11.5" fill="#D6DCD8" font-family="monospace">- static instancia: Registro</text>
    <text x="16" y="88" font-size="11.5" fill="#D6DCD8" font-family="monospace">- catalogo: Map&lt;id, IHabilidad&gt;</text>
    
    <line x1="14" y1="102" x2="251" y2="102" stroke="#354045" stroke-width="1"/>

    <!-- Métodos -->
    <text x="16" y="122" font-size="11.5" font-weight="600" fill="#7DB8FF" font-family="monospace">+ static getInstancia()</text>
    <text x="16" y="142" font-size="11.5" fill="#D6DCD8" font-family="monospace">+ registrar(habilidad): void</text>
    <text x="16" y="162" font-size="11.5" font-weight="600" fill="#F3A86E" font-family="monospace">+ crear(id): IHabilidad</text>

    <!-- Badge Explicativo -->
    <rect x="14" y="184" width="237" height="72" rx="6" fill="#17222B" stroke="#283E54" stroke-width="1"/>
    <circle cx="28" cy="202" r="5" fill="#3E82C8"/>
    <text x="40" y="206" font-size="11.5" font-weight="600" fill="#7DB8FF">Única fuente de verdad</text>
    <text x="24" y="226" font-size="10.5" fill="#9FA8A3">Registro dinámico en caliente.</text>
    <text x="24" y="242" font-size="10.5" fill="#9FA8A3">Despacha por clave única (id).</text>
  </g>

  <!-- ==================== 3. CARD: ESTRATEGIA (IHABILIDAD) ==================== -->
  <g transform="translate(635, 95)" filter="url(#card-shadow)">
    <!-- Interface Card -->
    <rect width="245" height="120" rx="10" fill="#252D30" stroke="#2E6B4F" stroke-width="1.3"/>
    <path d="M 0 10 Q 0 0 10 0 L 235 0 Q 245 0 245 10 L 245 42 L 0 42 Z" fill="#1B3128"/>
    <text x="14" y="26" font-size="10" font-weight="700" fill="#6BD6A2">&lt;&lt;interface&gt;&gt; STRATEGY</text>
    <text x="146" y="27" font-size="14.5" font-weight="700" fill="#FFFFFF">IHabilidad</text>

    <text x="16" y="62" font-size="11.5" fill="#D6DCD8" font-family="monospace">+ id: string</text>
    <text x="16" y="80" font-size="11.5" fill="#D6DCD8" font-family="monospace">+ nombre: string</text>
    <text x="16" y="100" font-size="11.5" font-weight="600" fill="#6BD6A2" font-family="monospace">+ usar(origen, objetivo)</text>
  </g>

  <!-- Implementaciones Concretas -->
  <g transform="translate(635, 235)" filter="url(#card-shadow)">
    <rect width="245" height="130" rx="10" fill="#202628" stroke="#384347" stroke-width="1"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#9FA8A3">ESTRATEGIAS CONCRETAS</text>

    <!-- Pills de habilidades -->
    <rect x="14" y="32" width="217" height="26" rx="4" fill="#2A3336"/>
    <text x="24" y="49" font-size="11" font-weight="600" fill="#FFFFFF">⚔️ GolpeEspada</text>
    <text x="175" y="49" font-size="10" fill="#E8833A">danio: 10</text>

    <rect x="14" y="63" width="217" height="26" rx="4" fill="#2A3336"/>
    <text x="24" y="80" font-size="11" font-weight="600" fill="#FFFFFF">🔥 BolaDeFuego</text>
    <text x="175" y="80" font-size="10" fill="#E8833A">danio: 25</text>

    <rect x="14" y="94" width="217" height="26" rx="4" fill="#2A3336"/>
    <text x="24" y="111" font-size="11" font-weight="600" fill="#FFFFFF">✨ Curacion</text>
    <text x="180" y="111" font-size="10" fill="#6BD6A2">hp: +20</text>
  </g>

  <!-- Flecha de Implementación (Habilidades -> IHabilidad) -->
  <line x1="757" y1="235" x2="757" y2="216" stroke="#6B7671" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#implements-triangle)"/>

  <!-- ==================== FLECHAS DE FLUJO INTERACTIVO ==================== -->
  
  <!-- Paso 1: Personaje -> Registro (pide habilidad) -->
  <path d="M 290 195 L 322 195" fill="none" stroke="#3E82C8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="293" y="172" width="24" height="18" rx="3" fill="#1C3854"/>
  <text x="305" y="185" font-size="11" font-weight="700" fill="#7DB8FF" text-anchor="middle">1</text>

  <!-- Paso 2: Registro entrega IHabilidad -->
  <path d="M 595 155 L 627 155" fill="none" stroke="#2E6B4F" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="599" y="132" width="24" height="18" rx="3" fill="#193B2D"/>
  <text x="611" y="145" font-size="11" font-weight="700" fill="#6BD6A2" text-anchor="middle">2</text>

  <!-- ==================== BANNER INFERIOR: PASO A PASO ==================== -->
  <g transform="translate(40, 385)">
    <rect width="840" height="105" rx="10" fill="#252D30" stroke="#354045" stroke-width="1"/>
    <text x="20" y="24" font-size="11.5" font-weight="700" fill="#9FA8A3" letter-spacing="0.5">FLUJO DE EJECUCIÓN (RUNTIME)</text>

    <!-- Paso 1 Box -->
    <g transform="translate(20, 36)">
      <rect width="185" height="54" rx="6" fill="#1B2225" stroke="#2B373B" stroke-width="1"/>
      <circle cx="18" cy="18" r="8" fill="#1C3854"/>
      <text x="18" y="22" font-size="10" font-weight="700" fill="#7DB8FF" text-anchor="middle">1</text>
      <text x="34" y="21" font-size="11" font-weight="600" fill="#FFFFFF">Obtener Catálogo</text>
      <text x="12" y="41" font-size="10" fill="#7DB8FF" font-family="monospace">getInstancia()</text>
    </g>

    <!-- Flechita -->
    <text x="215" y="67" font-size="16" fill="#6B7671">→</text>

    <!-- Paso 2 Box -->
    <g transform="translate(235, 36)">
      <rect width="185" height="54" rx="6" fill="#1B2225" stroke="#2B373B" stroke-width="1"/>
      <circle cx="18" cy="18" r="8" fill="#3B2E1E"/>
      <text x="18" y="22" font-size="10" font-weight="700" fill="#F3A86E" text-anchor="middle">2</text>
      <text x="34" y="21" font-size="11" font-weight="600" fill="#FFFFFF">Crear/Resolver</text>
      <text x="12" y="41" font-size="10" fill="#F3A86E" font-family="monospace">registro.crear(id)</text>
    </g>

    <!-- Flechita -->
    <text x="430" y="67" font-size="16" fill="#6B7671">→</text>

    <!-- Paso 3 Box -->
    <g transform="translate(450, 36)">
      <rect width="185" height="54" rx="6" fill="#1B2225" stroke="#2B373B" stroke-width="1"/>
      <circle cx="18" cy="18" r="8" fill="#193B2D"/>
      <text x="18" y="22" font-size="10" font-weight="700" fill="#6BD6A2" text-anchor="middle">3</text>
      <text x="34" y="21" font-size="11" font-weight="600" fill="#FFFFFF">Delegar Ejecución</text>
      <text x="12" y="41" font-size="10" fill="#6BD6A2" font-family="monospace">hab.usar(this, obj)</text>
    </g>

    <!-- Flechita -->
    <text x="645" y="67" font-size="16" fill="#6B7671">→</text>

    <!-- Paso 4 Box -->
    <g transform="translate(665, 36)">
      <rect width="155" height="54" rx="6" fill="#1B2225" stroke="#2B373B" stroke-width="1"/>
      <circle cx="18" cy="18" r="8" fill="#3B201E"/>
      <text x="18" y="22" font-size="10" font-weight="700" fill="#FF8D7D" text-anchor="middle">4</text>
      <text x="34" y="21" font-size="11" font-weight="600" fill="#FFFFFF">Efecto Aplicado</text>
      <text x="12" y="41" font-size="10" fill="#FF8D7D" font-family="monospace">obj.recibirDanio()</text>
    </g>
  </g>
</svg>
